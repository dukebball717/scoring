<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07110d">
<title>DANCAVE — NFL Scoreboard</title>
<style>
:root{--bg:#050907;--panel:#0b1511;--line:#23372d;--ink:#f3f7f4;--muted:#92a59a;--lime:#b7f34a;--gold:#f3c95a;--red:#ff5d5d;--cols:4;--rows:4}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% -20%,#1d3c2a 0,transparent 48%),linear-gradient(135deg,rgba(183,243,74,.025) 25%,transparent 25%) 0 0/18px 18px}
.app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:clamp(8px,1vh,14px);padding:clamp(12px,1.45vw,28px);position:relative}
.masthead{min-height:72px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-bottom:2px solid var(--lime);padding:0 2px clamp(8px,1vh,14px)}
.eyebrow{color:var(--lime);font-size:clamp(10px,.8vw,14px);font-weight:900;letter-spacing:.19em;text-transform:uppercase}.brand{font-family:Impact,"Arial Narrow",sans-serif;font-size:clamp(42px,5.5vw,88px);line-height:.82;letter-spacing:.045em;text-align:center;text-shadow:0 0 30px rgba(183,243,74,.18)}
.live-meta{justify-self:end;display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:800;font-size:clamp(11px,.85vw,15px);text-align:right}.signal{width:10px;height:10px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 5px rgba(146,165,154,.11)}.signal.live{background:var(--lime);box-shadow:0 0 0 5px rgba(183,243,74,.12);animation:pulse 1.5s infinite}.signal.error{background:var(--red);box-shadow:0 0 0 5px rgba(255,93,93,.12)}
.scoreboard{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-template-rows:repeat(var(--rows),minmax(0,1fr));gap:clamp(7px,.75vw,14px);min-height:0}
.game{position:relative;min-width:0;min-height:0;border:1px solid var(--line);border-radius:clamp(10px,1vw,18px);background:linear-gradient(145deg,rgba(15,28,22,.97),rgba(7,14,11,.97));box-shadow:0 10px 30px rgba(0,0,0,.23);overflow:hidden;padding:clamp(8px,.8vw,15px);display:grid;grid-template-rows:auto 1fr 1fr auto;gap:clamp(3px,.45vh,7px)}
.game:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent,#506258)}.game.is-live{border-color:rgba(183,243,74,.48);box-shadow:inset 0 0 25px rgba(183,243,74,.04),0 10px 30px rgba(0,0,0,.25)}.game.is-live:before{background:var(--lime)}
.game-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0;color:var(--muted);font-size:clamp(9px,.66vw,12px);font-weight:900;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}.status.live{color:var(--lime)}.network{overflow:hidden;text-overflow:ellipsis}
.team{display:grid;grid-template-columns:clamp(30px,2.8vw,51px) minmax(0,1fr) auto;align-items:center;gap:clamp(6px,.6vw,11px);min-width:0;border-radius:10px;padding:1px 3px}.team.winner{background:linear-gradient(90deg,rgba(183,243,74,.065),transparent)}.team.dim{opacity:.6}.logo{width:100%;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 5px 6px rgba(0,0,0,.38))}.team-copy{display:flex;align-items:baseline;gap:clamp(5px,.5vw,9px);min-width:0}.team-name{font-size:clamp(13px,1.05vw,21px);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.record{flex:none;color:var(--muted);font-size:clamp(9px,.65vw,12px);font-weight:800;white-space:nowrap}.score{font-family:Impact,"Arial Narrow",sans-serif;font-size:clamp(28px,2.9vw,54px);line-height:1;min-width:1.35ch;text-align:right;font-variant-numeric:tabular-nums}.possession:after{content:"◆";color:var(--gold);font-size:.52em;vertical-align:middle;margin-left:5px}
.game-foot{min-width:0;color:var(--muted);font-size:clamp(9px,.65vw,12px);font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1em}.game-foot strong{color:#dce7e0}
.footer{display:flex;align-items:center;justify-content:space-between;gap:14px;color:#7f9387;font-size:clamp(9px,.66vw,12px);font-weight:750;letter-spacing:.04em}.legend{display:flex;align-items:center;gap:14px}.tiny-live{color:var(--lime)}
.empty{grid-column:1/-1;grid-row:1/-1;display:grid;place-items:center;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-family:Impact,sans-serif;font-size:clamp(42px,6vw,100px);letter-spacing:.03em}.empty span{font-size:clamp(14px,1.4vw,24px)}
@keyframes pulse{50%{opacity:.42;transform:scale(.82)}}
</style>
</head>
<body>
<main class="app">
<header class="masthead"><div class="eyebrow">NFL · LIVE SCORES</div><div class="brand">DANCAVE</div><div class="live-meta"><span id="syncText">CONNECTING</span><i id="signal" class="signal"></i></div></header>
<section id="scoreboard" class="scoreboard" aria-live="polite"><div class="empty"><div><strong>LOADING</strong><span>Pulling the latest NFL scoreboard…</span></div></div></section>
<footer class="footer"><div class="legend"><span class="tiny-live">● LIVE</span><span>◆ POSSESSION</span></div><div>Scores &amp; team data via ESPN · Auto-refreshing</div></footer>
</main>
<div id="celebration" class="celebration" role="status" aria-live="assertive" aria-hidden="true"></div>
<style>
.celebration{position:fixed;inset:0;z-index:50;display:none;place-items:center;overflow:hidden;background:radial-gradient(circle at center,var(--team-glow,#2a5) 0,#050806 64%);isolation:isolate}.celebration.show{display:grid;animation:scene 5.8s both}.celebration:before,.celebration:after{content:"";position:absolute;inset:-25%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.18) 0 2deg,transparent 2deg 15deg);animation:spin 14s linear infinite;z-index:-1}.celebration:after{inset:0;background:linear-gradient(transparent 48%,rgba(255,255,255,.09) 49%,transparent 51%) 0 0/100% 34px;animation:scan 1s linear infinite}.celebration-card{text-align:center;display:grid;justify-items:center;gap:clamp(6px,1.2vh,18px);animation:slam .75s cubic-bezier(.16,1.45,.42,1) both}.celebration-logo{width:min(38vw,390px);height:min(38vh,390px);object-fit:contain;filter:drop-shadow(0 25px 30px rgba(0,0,0,.5));animation:float 1.2s ease-in-out infinite alternate}.celebration-kicker{font-size:clamp(16px,2vw,34px);font-weight:950;letter-spacing:.25em;text-transform:uppercase;color:rgba(255,255,255,.74)}.celebration-type{font-family:Impact,"Arial Narrow",sans-serif;font-size:clamp(72px,13vw,220px);line-height:.8;letter-spacing:.035em;text-transform:uppercase;text-shadow:0 8px 0 rgba(0,0,0,.28),0 0 55px rgba(255,255,255,.25)}.celebration-team{font-size:clamp(20px,2.6vw,46px);font-weight:950;text-transform:uppercase}.celebration-points{font-family:Impact,sans-serif;font-size:clamp(18px,2vw,34px);color:var(--lime)}.celebration-timer{position:absolute;left:0;bottom:0;height:8px;background:var(--lime);animation:drain 5.5s linear forwards}
@keyframes slam{0%{opacity:0;transform:scale(2.4) rotate(-4deg)}100%{opacity:1;transform:scale(1) rotate(0)}}@keyframes float{to{transform:translateY(-10px) scale(1.03)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes scan{to{background-position:0 34px}}@keyframes drain{from{width:100%}to{width:0}}@keyframes scene{0%{opacity:0}7%,87%{opacity:1}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}.celebration.show{animation:none}}
</style>
<script>
"use strict";
const SCOREBOARD_URL="https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard";
const board=document.getElementById("scoreboard"),syncText=document.getElementById("syncText"),signal=document.getElementById("signal"),overlay=document.getElementById("celebration");
const knownScores=new Map(), celebrationQueue=[];
let initialized=false,celebrating=false,lastSuccess=0,pollTimer=null,hasLiveGames=false;
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>Number.parseInt(v,10)||0;
function teamColor(team){const raw=(team?.color||team?.alternateColor||"2b5d42").replace("#","");return /^[0-9a-f]{6}$/i.test(raw)?`#${raw}`:"#2b5d42"}
function getRecord(c){const r=(c.records||[]).find(x=>x.type==="total")||(c.records||[])[0];return r?.summary||"—"}
function teamName(c){return c.team?.shortDisplayName||c.team?.name||c.team?.abbreviation||"Team"}
function statusLabel(event){const s=event.status||{},t=s.type||{};if(t.state==="in"){const period=s.period||0;if(period===2&&s.displayClock==="0:00")return"HALFTIME";if(period>4)return`${period-4}OT · ${s.displayClock||""}`.trim();return`${period?`Q${period}`:"LIVE"} · ${s.displayClock||""}`.trim()}if(t.state==="post")return t.shortDetail||"FINAL";const d=new Date(event.date);return Number.isNaN(d.valueOf())?(t.shortDetail||"SCHEDULED"):new Intl.DateTimeFormat([], {weekday:"short",hour:"numeric",minute:"2-digit"}).format(d)}
function eventSort(a,b){const rank={in:0,pre:1,post:2};return(rank[a.status?.type?.state]??3)-(rank[b.status?.type?.state]??3)||new Date(a.date)-new Date(b.date)}
function fitGrid(count){let cols=4;if(count===1)cols=1;else if(count<=4)cols=2;else if(count<=9)cols=3;const rows=Math.max(1,Math.ceil(count/cols));board.style.setProperty("--cols",cols);board.style.setProperty("--rows",rows)}
</script>
<script>
function renderGame(event){
 const comp=event.competitions?.[0]||{},teams=comp.competitors||[];
 const away=teams.find(c=>c.homeAway==="away")||teams[0]||{},home=teams.find(c=>c.homeAway==="home")||teams[1]||{};
 const state=event.status?.type?.state||"pre",isLive=state==="in",isFinal=state==="post";
 const winnerId=isFinal?(teams.find(c=>c.winner)?.id||""):"";
 const possession=comp.situation?.possession;
 const broadcasts=(comp.broadcasts||[]).flatMap(b=>b.names||[]).join(" · ");
 const detail=comp.situation?.downDistanceText||comp.situation?.lastPlay?.text||comp.venue?.fullName||"";
 const row=c=>{const logo=c.team?.logo||c.team?.logos?.[0]?.href||"";const faded=winnerId&&winnerId!==c.id?" dim":"";return `<div class="team${winnerId===c.id?" winner":""}${faded}">${logo?`<img class="logo" src="${esc(logo)}" alt="" referrerpolicy="no-referrer">`:`<div class="logo"></div>`}<div class="team-copy"><span class="team-name">${esc(teamName(c))}</span><span class="record">${esc(getRecord(c))}</span></div><span class="score${possession===c.id?" possession":""}">${esc(c.score??"0")}</span></div>`};
 const lead=detail?`<strong>${isLive?"NOW":"SITE"}</strong> · ${esc(detail)}`:"&nbsp;";
 return `<article class="game ${isLive?"is-live":""}" style="--accent:${teamColor(home)}"><div class="game-head"><span class="status ${isLive?"live":""}">${esc(statusLabel(event))}</span><span class="network">${esc(broadcasts)}</span></div>${row(away)}${row(home)}<div class="game-foot">${lead}</div></article>`
}
function render(events){
 const games=[...events].sort(eventSort);hasLiveGames=games.some(e=>e.status?.type?.state==="in");fitGrid(games.length||1);
 if(!games.length){board.innerHTML='<div class="empty"><div><strong>NO GAMES</strong><span>Waiting for the next NFL slate.</span></div></div>';return}
 board.innerHTML=games.map(renderGame).join("");
}
function inferScoreType(delta,lastPlay){
 const text=(lastPlay||"").toLowerCase();
 if(text.includes("touchdown"))return"TOUCHDOWN";
 if(text.includes("field goal")&&(text.includes("good")||text.includes("made")))return"FIELD GOAL";
 if(text.includes("safety"))return"SAFETY";
 if(text.includes("extra point")||text.includes("pat is good"))return"EXTRA POINT";
 if(text.includes("two-point")||text.includes("two point"))return"2-POINT TRY";
 if(delta===3)return"FIELD GOAL";if(delta===2)return"SAFETY";if(delta===1)return"EXTRA POINT";if(delta>=6)return"TOUCHDOWN";return"SCORE CHANGE";
}
function inspectScores(events){
 for(const event of events){
  const comp=event.competitions?.[0]||{},lastPlay=comp.situation?.lastPlay?.text||"";
  for(const c of comp.competitors||[]){
   const key=`${event.id}:${c.id}`,current=num(c.score),previous=knownScores.get(key);
   if(initialized&&previous!==undefined&&current>previous&&event.status?.type?.state==="in")celebrationQueue.push({team:c.team||{},delta:current-previous,type:inferScoreType(current-previous,lastPlay)});
   knownScores.set(key,previous===undefined?current:Math.max(previous,current));
  }
 }
 if(!celebrating)showNextCelebration();initialized=true;
}
function showNextCelebration(){
 const item=celebrationQueue.shift();if(!item){celebrating=false;return}celebrating=true;
 const logo=item.team.logo||item.team.logos?.[0]?.href||"";
 overlay.style.setProperty("--team-glow",teamColor(item.team));
 overlay.innerHTML=`<div class="celebration-card">${logo?`<img class="celebration-logo" src="${esc(logo)}" alt="">`:""}<div class="celebration-kicker">${esc(item.team.abbreviation||"NFL")} SCORES</div><div class="celebration-type">${esc(item.type)}</div><div class="celebration-team">${esc(item.team.displayName||item.team.name||"")}</div><div class="celebration-points">+${item.delta} POINT${item.delta===1?"":"S"}</div></div><div class="celebration-timer"></div>`;
 overlay.classList.remove("show");void overlay.offsetWidth;overlay.classList.add("show");overlay.setAttribute("aria-hidden","false");
 setTimeout(()=>{overlay.classList.remove("show");overlay.setAttribute("aria-hidden","true");setTimeout(showNextCelebration,180)},5800);
}
</script>
<script>
async function refresh(){
 clearTimeout(pollTimer);
 try{
  const res=await fetch(SCOREBOARD_URL,{cache:"no-store"});
  if(!res.ok)throw new Error(`HTTP ${res.status}`);
  const data=await res.json(),events=Array.isArray(data.events)?data.events:[];
  inspectScores(events);render(events);lastSuccess=Date.now();
  signal.className=`signal${hasLiveGames?" live":""}`;
 }catch(err){
  console.error("Scoreboard refresh failed",err);signal.className="signal error";
  if(!lastSuccess){board.innerHTML='<div class="empty"><div><strong>OFFLINE</strong><span>Could not reach ESPN. Retrying automatically…</span></div></div>'}
 }
 pollTimer=setTimeout(refresh,hasLiveGames?5000:30000);
}
function updateSync(){
 if(!lastSuccess){syncText.textContent="CONNECTING";return}
 const age=Math.max(0,Math.floor((Date.now()-lastSuccess)/1000));
 syncText.textContent=signal.classList.contains("error")?`RETRYING · ${age}s AGO`:`UPDATED ${age}s AGO`;
}
setInterval(updateSync,1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
window.addEventListener("online",refresh);
refresh();
</script>
</body>
</html>
