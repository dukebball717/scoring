<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7th Annual Race Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:ital,wght@0,500;0,700;1,700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --asphalt:#0b0d10;
    --surface:#151a22;
    --surface-2:#1b212b;
    --hairline:#2c3340;
    --gold:#f5c518;
    --gold-soft:rgba(245,197,24,0.35);
    --chrome:#e7eaee;
    --chrome-dim:#93a0ad;
    --chevy:#f5b400;
    --ford:#2f8fd6;
    --toyota:#e33b3b;
  }

  *{box-sizing:border-box;}
  html,body{height:100%; margin:0; overflow:hidden;}

  body{
    background:radial-gradient(ellipse at top, #171d26 0%, var(--asphalt) 60%);
    color:var(--chrome);
    font-family:'Inter', sans-serif;
  }

  .page{
    height:100vh;
    width:100vw;
    display:flex;
    flex-direction:column;
    padding:3.2vh 1.4vw 1.2vh;
  }

  /* ---------- HEADER ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:2vw;
    flex:0 0 auto;
    margin-bottom:1.2vh;
  }

  .logo-slot{
    flex:0 0 auto;
    height:9vh;
    width:16vw;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .logo-slot.has-logo{
    background:#fff;
    border-radius:10px;
    padding:.7vh .9vw;
    box-shadow:0 0 1.6vh rgba(245,197,24,0.25);
  }
  .logo-slot img{ max-height:100%; max-width:100%; object-fit:contain; display:block; }
  .logo-fallback{
    display:flex;
    align-items:center;
    gap:.6vw;
    font-family:'Oswald', sans-serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.05em;
    font-size:1.35vh;
    color:var(--gold);
    border:1.5px solid var(--gold-soft);
    background:linear-gradient(180deg, rgba(245,197,24,0.08), transparent);
    border-radius:8px;
    padding:1vh 1.1vw;
    text-align:left;
    line-height:1.25;
    box-shadow:0 0 1.5vh rgba(245,197,24,0.12) inset;
  }
  .logo-fallback .lf-icon{ width:2.6vh; height:1.8vh; flex:0 0 auto; }

  h1{
    flex:1;
    text-align:center;
    font-family:'Oswald', sans-serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    font-size:5.4vh;
    margin:0;
    color:#fff;
    text-shadow:0 0 3vh rgba(245,197,24,.25);
  }
  h1 span{ color:var(--gold); }

  /* ---------- CHECKERED DIVIDER STRIPS ---------- */
  .checker-strip{
    flex:0 0 auto;
    height:1vh;
    background-image:
      linear-gradient(45deg,#000 25%,transparent 25%,transparent 75%,#000 75%),
      linear-gradient(45deg,#000 25%,transparent 25%,transparent 75%,#000 75%);
    background-color:#eee;
    background-size:1.6vh 1.6vh;
    background-position:0 0, .8vh .8vh;
    margin-bottom:1.2vh;
    border-radius:2px;
  }

  /* ---------- BOARD ---------- */
  main{
    flex:1 1 auto;
    min-height:0;
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    grid-template-rows:repeat(2, 1fr);
    gap:1vh 0.8vw;
  }

  .pool{
    position:relative;
    min-height:0;
    background:var(--surface);
    border:1px solid var(--hairline);
    border-radius:6px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    box-shadow:0 0 0 1px rgba(245,197,24,0.06), 0 0 1.6vh rgba(245,197,24,0.08);
  }

  /* golden broadcast sheen sweeping through each box, staggered */
  .pool::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(100deg,
      transparent 0%,
      rgba(245,197,24,0.28) 48%,
      transparent 62%);
    transform:translateX(-130%);
    animation:sheen 5.5s ease-in-out infinite;
    animation-delay:calc(var(--i, 0) * 0.4s);
    pointer-events:none;
    mix-blend-mode:screen;
  }
  @keyframes sheen{
    0%   { transform:translateX(-130%); }
    35%  { transform:translateX(150%); }
    100% { transform:translateX(150%); }
  }

  .pool-head{
    flex:0 0 auto;
    background:var(--surface-2);
    border-bottom:2px solid var(--gold);
    padding:.9vh .8vw;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:.5vw;
    position:relative;
    z-index:1;
  }

  .pool-name{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    font-size:min(4.8vh, 2.8vw);
    color:#fff;
    line-height:1.05;
  }

  .flag-badge{
    display:flex;
    align-items:center;
    gap:.5vw;
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:min(2.6vh, 1.6vw);
    color:var(--gold);
    flex:0 0 auto;
  }

  .flag-icon{
    width:min(5vh, 3.2vw);
    height:min(3.3vh, 2.1vw);
    flex:0 0 auto;
    display:block;
  }
  .flag-icon svg{
    width:100%;
    height:100%;
    display:block;
    animation:wave 2.3s ease-in-out infinite;
    animation-delay:calc(var(--fi, 0) * 0.2s);
    transform-origin:2px center;
  }
  @keyframes wave{
    0%, 100% { transform:skewY(0deg); }
    50%      { transform:skewY(8deg); }
  }

  .drivers{
    flex:1 1 auto;
    min-height:0;
    display:grid;
    grid-template-rows:repeat(3, 1fr);
    position:relative;
    z-index:1;
  }

  .driver{
    display:flex;
    align-items:center;
    gap:.6vw;
    padding:0 .7vw;
    border-top:1px solid var(--hairline);
    min-width:0;
  }

  .roundel{
    flex:0 0 auto;
    width:min(4.9vh, 3.6vw);
    height:min(4.9vh, 3.6vw);
    border-radius:50%;
    background:#fff;
    border:min(.5vh,.36vw) solid var(--num-color, var(--chrome-dim));
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-style:italic;
    font-size:min(2.3vh, 1.7vw);
    color:#111;
  }

  .driver-name{
    flex:1 1 auto;
    min-width:0;
    font-family:'Oswald', sans-serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.01em;
    font-size:min(4.4vh, 2.6vw);
    color:#fff;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
</style>
</head>

      <rect width="2" height="2" fill="#111111"/>
      <rect x="2" y="2" width="2" height="2" fill="#111111"/>
    </pattern>
    <symbol id="flagShape" viewBox="0 0 24 16">
      <line x1="1.2" y1="0" x2="1.2" y2="16" stroke="#555" stroke-width="1"/>
      <path d="M2,2 L19,2 Q21.5,4 19,6 Q16.5,8 19,10 Q21.5,12 19,14 L2,14 Z"
            fill="url(#checkerPattern)" stroke="#111" stroke-width="0.6"/>
    </symbol>
  </defs>
</svg>
