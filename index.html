<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DANCAVE</title>
<style>
  :root{
    --bg:#07090c;
    --panel:#0f1319;
    --line:#1c222b;
    --ink:#eef2f6;
    --dim:#7c8898;
    --live:#e0393e;
    --gold:#d9a441;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    width:100vw;height:100vh;overflow:hidden;
    background:var(--bg);color:var(--ink);
    font-family:'Arial Narrow',Arial,sans-serif;
  }
  #app{width:100vw;height:100vh;display:flex;flex-direction:column;}

  header{
    flex:0 0 auto;
    display:flex;align-items:baseline;justify-content:center;gap:1.2vw;
    padding:1.1vh 0 .8vh;
    border-bottom:2px solid var(--line);
    background:linear-gradient(180deg,#0b0e13,#07090c);
  }
  header h1{
    font-family:Georgia,'Times New Roman',serif;
    font-weight:700;
    font-size:5.2vh;
    letter-spacing:.14em;
    color:var(--ink);
  }
  header .sub{
    font-size:1.7vh;
    color:var(--gold);
    letter-spacing:.2em;
    align-self:center;
  }
  #clock{
    position:fixed;top:1.4vh;right:2vw;
    font-size:1.6vh;color:var(--dim);letter-spacing:.08em;
  }

  #grid{
    flex:1 1 auto;
    display:grid;
    gap:1.1vh 1vw;
    padding:1.3vh 1.4vw;
    min-height:0;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    display:flex;flex-direction:column;
    min-height:0;
    position:relative;
    overflow:hidden;
  }
  .card.is-live{ border-color:#3a1417; box-shadow:0 0 0 1px rgba(224,57,62,.25) inset; }

  .card .status{
    flex:0 0 auto;
    text-align:center;
    font-size:1.5vh;
    padding:.6vh 0 .2vh;
    color:var(--dim);
    letter-spacing:.08em;
  }
  .card.is-live .status{ color:var(--live); font-weight:700; }
  .card .status .dot{
    display:inline-block;width:.9vh;height:.9vh;border-radius:50%;
    background:var(--live);margin-right:.5vh;
    animation:pulse 1.4s infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  .teams{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;min-height:0;padding:0 1vw;}
  .team-row{display:flex;align-items:center;padding:.6vh 0;}
  .team-row + .team-row{border-top:1px solid var(--line);}
  .team-row img{
    height:5.4vh;width:5.4vh;object-fit:contain;flex:0 0 auto;
    filter:drop-shadow(0 0 4px rgba(0,0,0,.5));
  }
  .team-info{flex:1 1 auto;min-width:0;padding:0 1vw;}
  .team-name{
    font-size:2.1vh;font-weight:700;letter-spacing:.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .team-record{font-size:1.3vh;color:var(--dim);}
  .team-score{
    font-size:3.6vh;font-weight:700;min-width:3.2vw;text-align:right;
    font-variant-numeric:tabular-nums;
  }
  .team-row.leader .team-score{color:var(--gold);}
  .team-row.possession .team-name::after{
    content:'●'; color:var(--live); font-size:1.1vh; margin-left:.6vh; vertical-align:middle;
  }

  .situation{
    flex:0 0 auto;text-align:center;font-size:1.3vh;color:var(--dim);
    padding:.2vh 0 .7vh;letter-spacing:.04em;
  }

  #empty{
    flex:1;display:flex;align-items:center;justify-content:center;
    font-size:3vh;color:var(--dim);letter-spacing:.06em;
  }

  /* ---- full screen score overlay ---- */
  #overlay{
    position:fixed;inset:0;z-index:50;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;
    background:radial-gradient(circle at center,var(--flash,#e0393e) 0%,#07090c 78%);
    transition:opacity .35s ease;
  }
  #overlay.show{opacity:1;}
  #overlay img{
    height:34vh;width:34vh;object-fit:contain;
    filter:drop-shadow(0 0 30px rgba(0,0,0,.6));
    transform:scale(.6);opacity:0;
    animation:pop .5s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  @keyframes pop{to{transform:scale(1);opacity:1;}}
  #overlay .kind{
    margin-top:3vh;font-size:6vh;font-weight:800;letter-spacing:.08em;
    color:#fff;text-shadow:0 0 18px rgba(0,0,0,.6);
    opacity:0;animation:rise .5s ease .2s forwards;
  }
  #overlay .who{
    margin-top:1.2vh;font-size:2.4vh;letter-spacing:.15em;color:#fff9;
    opacity:0;animation:rise .5s ease .35s forwards;
  }
  @keyframes rise{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<div id="app">
  <header><h1>DANCAVE</h1><span class="sub" id="weekLabel">NFL</span></header>
  <div id="clock"></div>
  <div id="grid"></div>
  <div id="empty" style="display:none;">No games today</div>
</div>

<div id="overlay">
  <img id="ovLogo" alt="">
  <div class="kind" id="ovKind"></div>
  <div class="who" id="ovWho"></div>
</div>

<script>
const SCOREBOARD_URL = "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard";
const FAST_POLL = 3000;   // ms while any game is live
const SLOW_POLL = 20000;  // ms when nothing is live

const prevScores = {};   // gameId -> {home:n, away:n}
const overlayQueue = [];
let overlayBusy = false;

function scoreKind(diff){
  if(diff>=8) return "TOUCHDOWN + 2PT";
  if(diff===7) return "TOUCHDOWN";
  if(diff===6) return "TOUCHDOWN";
  if(diff===3) return "FIELD GOAL";
  if(diff===2) return "SAFETY";
  if(diff===1) return "EXTRA POINT";
  return "SCORE";
}

function queueOverlay(team, kind){
  overlayQueue.push({team, kind});
  runOverlayQueue();
}

function runOverlayQueue(){
  if(overlayBusy || overlayQueue.length===0) return;
  overlayBusy = true;
  const {team, kind} = overlayQueue.shift();
  const ov = document.getElementById('overlay');
  document.getElementById('ovLogo').src = team.logo;
  document.getElementById('ovKind').textContent = kind;
  document.getElementById('ovWho').textContent = team.displayName.toUpperCase();
  ov.style.setProperty('--flash', team.color ? ('#'+team.color) : '#e0393e');
  // restart animations
  document.getElementById('ovLogo').style.animation='none';
  document.getElementById('ovKind').style.animation='none';
  document.getElementById('ovWho').style.animation='none';
  void ov.offsetWidth;
  document.getElementById('ovLogo').style.animation='';
  document.getElementById('ovKind').style.animation='';
  document.getElementById('ovWho').style.animation='';
  ov.classList.add('show');
  setTimeout(()=>{
    ov.classList.remove('show');
    setTimeout(()=>{ overlayBusy=false; runOverlayQueue(); }, 400);
  }, 3200);
}

function competitorInfo(c){
  return {
    id: c.team.id,
    displayName: c.team.shortDisplayName || c.team.name,
    abbr: c.team.abbreviation,
    logo: c.team.logo,
    color: c.team.color,
    score: parseInt(c.score||'0',10),
    record: (c.records && c.records[0]) ? c.records[0].summary : '',
    homeAway: c.homeAway,
    possession: false
  };
}

function layoutGrid(count){
  const grid = document.getElementById('grid');
  let cols;
  if(count<=2) cols=count;
  else if(count<=4) cols=2;
  else if(count<=9) cols=3;
  else if(count<=12) cols=4;
  else cols=4;
  const rows = Math.ceil(count/cols) || 1;
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
}

async function poll(){
  let hasLive = false;
  try{
    const res = await fetch(SCOREBOARD_URL, {cache:'no-store'});
    const data = await res.json();
    const events = data.events || [];
    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');

    if(events.length===0){
      grid.style.display='none';
      empty.style.display='flex';
    } else {
      grid.style.display='grid';
      empty.style.display='none';
      layoutGrid(events.length);
      grid.innerHTML='';

      const wk = data.week ? `WEEK ${data.week.number}` : 'NFL';
      document.getElementById('weekLabel').textContent = wk;

      events.forEach(ev=>{
        const comp = ev.competitions[0];
        const state = comp.status.type.state; // pre, in, post
        if(state==='in') hasLive = true;

        let home = comp.competitors.find(c=>c.homeAway==='home');
        let away = comp.competitors.find(c=>c.homeAway==='away');
        home = competitorInfo(home);
        away = competitorInfo(away);

        const situation = comp.situation;
        if(situation && situation.possession){
          if(situation.possession === home.id) home.possession = true;
          if(situation.possession === away.id) away.possession = true;
        }

        // detect scoring changes
        const prev = prevScores[ev.id];
        if(prev){
          [ [home,'home'], [away,'away'] ].forEach(([team,side])=>{
            const before = prev[side];
            const after = team.score;
            if(after > before){
              queueOverlay(team, scoreKind(after-before));
            }
          });
        }
        prevScores[ev.id] = {home:home.score, away:away.score};

        const card = document.createElement('div');
        card.className = 'card' + (state==='in' ? ' is-live' : '');

        let statusText;
        if(state==='pre'){
          statusText = new Date(ev.date).toLocaleString('en-US',{weekday:'short',hour:'numeric',minute:'2-digit'});
        } else if(state==='post'){
          statusText = 'FINAL' + (comp.status.type.name==='STATUS_FINAL_OVERTIME'?'/OT':'');
        } else {
          statusText = `<span class="dot"></span>${comp.status.type.shortDetail}`;
        }

        const leaderHome = home.score>away.score;
        const leaderAway = away.score>home.score;

        card.innerHTML = `
          <div class="status">${statusText}</div>
          <div class="teams">
            <div class="team-row ${leaderAway?'leader':''} ${away.possession?'possession':''}">
              <img src="${away.logo}" alt="${away.abbr}">
              <div class="team-info">
                <div class="team-name">${away.displayName}</div>
                <div class="team-record">${away.record}</div>
              </div>
              <div class="team-score">${state==='pre' ? '' : away.score}</div>
            </div>
            <div class="team-row ${leaderHome?'leader':''} ${home.possession?'possession':''}">
              <img src="${home.logo}" alt="${home.abbr}">
              <div class="team-info">
                <div class="team-name">${home.displayName}</div>
                <div class="team-record">${home.record}</div>
              </div>
              <div class="team-score">${state==='pre' ? '' : home.score}</div>
            </div>
          </div>
          <div class="situation">${state==='in' && situation && situation.downDistanceText ? situation.downDistanceText : ''}</div>
        `;
        grid.appendChild(card);
      });
    }
  }catch(err){
    console.error('scoreboard fetch failed', err);
  }

  document.getElementById('clock').textContent = new Date().toLocaleTimeString();
  setTimeout(poll, hasLive ? FAST_POLL : SLOW_POLL);
}

poll();
</script>
</body>
</html>
