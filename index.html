<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>NFL Live Scoreboard</title>
<style>
:root{--bg:#050806;--ink:#f7faf8;--muted:#9eaaa3;--lime:#b9f34b;--gold:#ffd35a;--red:#ff4545;--cols:4;--rows:4}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% -20%,#173321 0,transparent 45%),linear-gradient(135deg,rgba(255,255,255,.018) 25%,transparent 25%) 0 0/18px 18px}
.app{height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:clamp(5px,.55vh,9px);padding:clamp(6px,.65vw,12px);position:relative}
.scoreboard{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-template-rows:repeat(var(--rows),minmax(0,1fr));gap:clamp(5px,.55vw,10px);min-height:0}
.game{--away:#26372e;--home:#13291d;position:relative;min-width:0;min-height:0;border:1px solid color-mix(in srgb,var(--away) 45%,#52605a);border-radius:clamp(9px,.8vw,15px);background:linear-gradient(145deg,color-mix(in srgb,var(--away) 34%,#0a0e0c),#090d0b 48%,color-mix(in srgb,var(--home) 38%,#080c0a));box-shadow:inset 0 1px rgba(255,255,255,.06),0 8px 24px rgba(0,0,0,.33);overflow:hidden;padding:clamp(5px,.5vw,10px);display:grid;grid-template-rows:auto 1fr 1fr auto;gap:clamp(2px,.28vh,5px);isolation:isolate}
.game:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(115deg,color-mix(in srgb,var(--away) 28%,transparent) 0 43%,transparent 47% 53%,color-mix(in srgb,var(--home) 29%,transparent) 57% 100%)}
.game:after{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--away),var(--home));filter:saturate(1.4)}.game.is-live{border-color:rgba(185,243,75,.52);box-shadow:inset 0 0 25px rgba(185,243,75,.045),0 8px 24px rgba(0,0,0,.36)}
.game-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:5px;min-width:0}.status{grid-column:2;color:#f2f7f4;font-size:clamp(15px,1.22vw,24px);line-height:1;font-weight:1000;letter-spacing:.045em;text-transform:uppercase;white-space:nowrap;padding:3px 10px;border-radius:6px;background:rgba(0,0,0,.35);font-variant-numeric:tabular-nums}.status.live{color:var(--lime);text-shadow:0 0 15px rgba(185,243,75,.28)}
.badges{grid-column:3;justify-self:end;display:flex;gap:5px}.red-zone{display:none;color:#fff;background:#d91920;border:1px solid #ff7176;border-radius:4px;padding:3px 6px;font-size:clamp(8px,.65vw,12px);font-weight:1000;letter-spacing:.06em;white-space:nowrap;box-shadow:0 0 14px rgba(255,35,43,.8)}.game.in-red-zone .red-zone{display:inline-block;animation:redZonePulse .8s ease-in-out infinite alternate}.status.two-minute{color:#fff;background:#c71920;box-shadow:0 0 16px rgba(255,40,48,.7);animation:clockAlert .72s ease-in-out infinite alternate}
.team{display:grid;grid-template-columns:clamp(38px,5.7vh,64px) minmax(0,1fr) auto;align-items:center;gap:clamp(6px,.58vw,11px);min-width:0;border-radius:9px;padding:1px 5px}.team.away{background:linear-gradient(90deg,color-mix(in srgb,var(--away) 35%,transparent),transparent 78%)}.team.home{background:linear-gradient(90deg,color-mix(in srgb,var(--home) 35%,transparent),transparent 78%)}.team.winner{box-shadow:inset 4px 0 var(--lime)}.team.dim{opacity:.58}.logo{width:100%;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 5px 7px rgba(0,0,0,.5))}.team-copy{display:flex;align-items:baseline;gap:clamp(5px,.48vw,9px);min-width:0}.team-name{font-size:clamp(16px,1.23vw,24px);line-height:1;font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.record{flex:none;color:#d0d8d3;font-size:clamp(10px,.7vw,14px);font-weight:850;white-space:nowrap}
.score-box{position:relative;min-width:1.5ch;height:clamp(31px,3.05vw,60px);perspective:220px;text-align:right}.score{display:block;font-family:Impact,"Arial Narrow",sans-serif;font-size:clamp(31px,3.05vw,60px);line-height:1;font-variant-numeric:tabular-nums;transform-origin:50% 50%}.score.flip{animation:scoreFlip .82s cubic-bezier(.2,.78,.3,1)}.possession:after{content:"◆";color:var(--gold);font-size:.4em;vertical-align:middle;margin-left:5px;text-shadow:0 0 9px rgba(255,211,90,.5)}
.game-foot{display:flex;align-items:center;justify-content:center;min-width:0;min-height:clamp(25px,3.3vh,37px);padding:2px 7px;border-radius:6px;background:rgba(0,0,0,.52);border-top:1px solid rgba(255,255,255,.09);white-space:nowrap;overflow:hidden}.game-foot strong{flex:none;color:var(--lime);margin-right:8px;font-size:clamp(11px,.72vw,14px);font-weight:1000;letter-spacing:.08em}.situation{overflow:hidden;text-overflow:ellipsis;color:#fff;font-size:clamp(14px,1.02vw,20px);font-weight:1000;letter-spacing:.015em}
.ticker{height:clamp(48px,5.7vh,64px);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;border:1px solid #3b4a42;border-radius:8px;background:#080d0a;overflow:hidden;box-shadow:inset 0 1px rgba(255,255,255,.05),0 6px 20px rgba(0,0,0,.3)}.ticker-label{height:100%;display:flex;align-items:center;padding:0 clamp(14px,1.5vw,28px);background:var(--lime);color:#071008;font-family:Impact,"Arial Narrow",sans-serif;font-size:clamp(19px,1.55vw,30px);letter-spacing:.09em;white-space:nowrap;z-index:2}.ticker-window{height:100%;display:flex;align-items:center;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 2%,#000 98%,transparent)}.ticker-track{display:flex;width:max-content;animation:tickerMove var(--ticker-duration,65s) linear infinite;will-change:transform}.ticker-set{display:flex;align-items:center;white-space:nowrap;padding-right:4rem}.ticker-item{display:inline-flex;align-items:center;gap:.55rem;font-size:clamp(13px,.9vw,17px);font-weight:900;color:#edf3ef}.ticker-item b{color:var(--lime);font-size:.82em;letter-spacing:.09em}.ticker-item.news b{color:var(--gold)}.ticker-item:after{content:"◆";color:var(--gold);margin:0 1.7rem;font-size:.65em}.ticker-empty{color:var(--muted);font-size:clamp(12px,.82vw,16px);font-weight:850;letter-spacing:.06em;padding-left:18px}.sync{height:100%;display:flex;align-items:center;gap:9px;padding:0 clamp(10px,1.1vw,20px);border-left:1px solid #35433b;background:#0d1510;color:#c4cec8;font-size:clamp(10px,.7vw,13px);font-weight:950;letter-spacing:.05em;white-space:nowrap;font-variant-numeric:tabular-nums}.signal{width:9px;height:9px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 4px rgba(148,162,154,.11)}.signal.live{background:var(--lime);box-shadow:0 0 0 4px rgba(185,243,75,.12);animation:pulse 1.5s infinite}.signal.error{background:var(--red)}
.empty{grid-column:1/-1;grid-row:1/-1;display:grid;place-items:center;text-align:center;border:1px dashed #31443a;border-radius:16px;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-family:Impact,sans-serif;font-size:clamp(38px,5vw,82px);letter-spacing:.03em}.empty span{font-size:clamp(13px,1.2vw,21px)}
.celebration{position:fixed;inset:0;z-index:50;display:none;place-items:center;overflow:hidden;background:radial-gradient(circle at center,var(--team-glow,#2a5) 0,#050806 64%);isolation:isolate}.celebration.show{display:grid;animation:scene 5.8s both}.celebration:before,.celebration:after{content:"";position:absolute;inset:-25%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.18) 0 2deg,transparent 2deg 15deg);animation:spin 14s linear infinite;z-index:-1}.celebration:after{inset:0;background:linear-gradient(transparent 48%,rgba(255,255,255,.09) 49%,transparent 51%) 0 0/100% 34px;animation:scan 1s linear infinite}.celebration-card{text-align:center;display:grid;justify-items:center;gap:clamp(6px,1.2vh,18px);animation:slam .75s cubic-bezier(.16,1.45,.42,1) both}.celebration-logo{width:min(38vw,390px);height:min(38vh,390px);object-fit:contain;filter:drop-shadow(0 25px 30px rgba(0,0,0,.5));animation:float 1.2s ease-in-out infinite alternate}.celebration-kicker{font-size:clamp(16px,2vw,34px);font-weight:950;letter-spacing:.25em;text-transform:uppercase;color:rgba(255,255,255,.74)}.celebration-type{font-family:Impact,"Arial Narrow",sans-serif;font-size:clamp(72px,13vw,220px);line-height:.8;letter-spacing:.035em;text-transform:uppercase;text-shadow:0 8px 0 rgba(0,0,0,.28),0 0 55px rgba(255,255,255,.25)}
.celebration-team{font-size:clamp(20px,2.6vw,46px);font-weight:950;text-transform:uppercase}.celebration-points{font-family:Impact,sans-serif;font-size:clamp(18px,2vw,34px);color:var(--lime)}.celebration-timer{position:absolute;left:0;bottom:0;height:8px;background:var(--lime);animation:drain 5.5s linear forwards}
.scoreboard[data-rows="1"] .team{grid-template-columns:clamp(85px,14vh,155px) minmax(0,1fr) auto}.scoreboard[data-rows="1"] .team-name{font-size:clamp(32px,3.8vw,72px)}.scoreboard[data-rows="1"] .record{font-size:clamp(18px,1.5vw,28px)}.scoreboard[data-rows="1"] .score,.scoreboard[data-rows="1"] .score-box{font-size:clamp(60px,7vw,130px);height:clamp(60px,7vw,130px)}.scoreboard[data-rows="2"] .team{grid-template-columns:clamp(62px,9vh,96px) minmax(0,1fr) auto}.scoreboard[data-rows="2"] .team-name{font-size:clamp(23px,2vw,38px)}.scoreboard[data-rows="2"] .score,.scoreboard[data-rows="2"] .score-box{font-size:clamp(45px,4.4vw,82px);height:clamp(45px,4.4vw,82px)}
@keyframes pulse{50%{opacity:.42;transform:scale(.82)}}@keyframes redZonePulse{to{box-shadow:0 0 26px 5px rgba(255,35,43,.82);transform:scale(1.035)}}@keyframes clockAlert{to{background:#ff2028;box-shadow:0 0 24px rgba(255,40,48,.9)}}@keyframes scoreFlip{0%{transform:rotateX(0);filter:brightness(1)}42%{transform:rotateX(-90deg);filter:brightness(2)}55%{transform:rotateX(65deg);color:var(--lime)}100%{transform:rotateX(0);filter:brightness(1)}}@keyframes tickerMove{to{transform:translateX(-50%)}}@keyframes slam{0%{opacity:0;transform:scale(2.4) rotate(-4deg)}100%{opacity:1;transform:scale(1)}}@keyframes float{to{transform:translateY(-10px) scale(1.03)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes scan{to{background-position:0 34px}}@keyframes drain{from{width:100%}to{width:0}}@keyframes scene{0%{opacity:0}7%,87%{opacity:1}100%{opacity:0}}
@media(max-height:800px){.app{padding:5px;gap:4px}.game{padding:4px 6px}.team{grid-template-columns:clamp(34px,5.15vh,45px) minmax(0,1fr) auto}.team-name{font-size:clamp(14px,1.1vw,20px)}.record{font-size:clamp(9px,.62vw,12px)}.score,.score-box{font-size:clamp(27px,2.55vw,46px);height:clamp(27px,2.55vw,46px)}.status{font-size:clamp(13px,1vw,18px);padding:2px 8px}.game-foot{min-height:24px}.situation{font-size:clamp(12px,.88vw,16px)}.ticker{height:43px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}.celebration.show{animation:none}.ticker-track{animation:none;transform:none}}
</style>
</head>
<body>
<main class="app">
<section id="scoreboard" class="scoreboard" aria-live="polite"><div class="empty"><div><strong>LOADING</strong><span>Pulling the latest NFL scoreboard…</span></div></div></section>
<div class="ticker" aria-label="Live sports scores and headlines"><div class="ticker-label">DANCAVE</div><div id="tickerWindow" class="ticker-window"><div class="ticker-empty">CONNECTING TO LIVE SPORTS FEEDS…</div></div><div class="sync"><span id="syncText">CONNECTING</span><i id="signal" class="signal"></i></div></div>
</main>
<div id="celebration" class="celebration" role="status" aria-live="assertive" aria-hidden="true"></div>
<script>
"use strict";
const SCOREBOARD_URL="https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard";
const TICKER_FEEDS=[
 {label:"NFL",score:"https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard",news:"https://site.api.espn.com/apis/site/v2/sports/football/nfl/news"},
 {label:"CFB",score:"https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard",news:"https://site.api.espn.com/apis/site/v2/sports/football/college-football/news"},
 {label:"MLB",score:"https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard",news:"https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/news"},
 {label:"NBA",score:"https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard",news:"https://site.api.espn.com/apis/site/v2/sports/basketball/nba/news"},
 {label:"WNBA",score:"https://site.api.espn.com/apis/site/v2/sports/basketball/wnba/scoreboard",news:"https://site.api.espn.com/apis/site/v2/sports/basketball/wnba/news"},
 {label:"NHL",score:"https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard",news:"https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/news"},
 {label:"MLS",score:"https://site.api.espn.com/apis/site/v2/sports/soccer/usa.1/scoreboard",news:"https://site.api.espn.com/apis/site/v2/sports/soccer/usa.1/news"}
];
const board=document.getElementById("scoreboard"),syncText=document.getElementById("syncText"),signal=document.getElementById("signal"),overlay=document.getElementById("celebration"),tickerWindow=document.getElementById("tickerWindow");
const knownScores=new Map(),celebrationQueue=[],scoreChanges=new Set();
let initialized=false,celebrating=false,lastSuccess=0,pollTimer=null,tickerTimer=null,hasLiveGames=false,tickerItems=[];
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>Number.parseInt(v,10)||0;
function teamColor(team,fallback="26372e"){const raw=(team?.color||team?.alternateColor||fallback).replace("#","");return /^[0-9a-f]{6}$/i.test(raw)?`#${raw}`:`#${fallback}`}
function getRecord(c){const r=(c.records||[]).find(x=>x.type==="total")||(c.records||[])[0];return r?.summary||"—"}
function teamName(c){return c.team?.shortDisplayName||c.team?.name||c.team?.abbreviation||"Team"}
function statusInfo(event){const s=event.status||{},t=s.type||{},period=s.period||0,clock=s.displayClock||"";if(t.state==="in"){let label;if(period===2&&clock==="0:00")label="HALFTIME";else if(period>4)label=`${period-4}OT · ${clock}`.trim();else label=`${period?`Q${period}`:"LIVE"} · ${clock}`.trim();const m=clock.match(/^(\d+):(\d{2})$/),seconds=m?(+m[1]*60)+(+m[2]):9999;return{label,twoMinute:(period===2||period===4)&&seconds>0&&seconds<=120}}if(t.state==="post")return{label:t.shortDetail||"FINAL",twoMinute:false};const d=new Date(event.date);return{label:Number.isNaN(d.valueOf())?(t.shortDetail||"SCHEDULED"):new Intl.DateTimeFormat([],{weekday:"short",hour:"numeric",minute:"2-digit"}).format(d),twoMinute:false}}
function eventSort(a,b){const rank={in:0,pre:1,post:2};return(rank[a.status?.type?.state]??3)-(rank[b.status?.type?.state]??3)||new Date(a.date)-new Date(b.date)}
function fitGrid(count){let cols=4;if(count===1)cols=1;else if(count<=4)cols=2;else if(count<=9)cols=3;const rows=Math.max(1,Math.ceil(count/cols));board.style.setProperty("--cols",cols);board.style.setProperty("--rows",rows);board.dataset.rows=String(rows)}
function situationText(comp){const raw=comp.situation?.downDistanceText||"";return raw.replace(/\s+at\s+/i," • ")}
function renderGame(event){const comp=event.competitions?.[0]||{},teams=comp.competitors||[],away=teams.find(c=>c.homeAway==="away")||teams[0]||{},home=teams.find(c=>c.homeAway==="home")||teams[1]||{},state=event.status?.type?.state||"pre",isLive=state==="in",isFinal=state==="post",winnerId=isFinal?(teams.find(c=>c.winner)?.id||""):"",possession=comp.situation?.possession,redZone=isLive&&comp.situation?.isRedZone===true,info=statusInfo(event);
 const row=(c,side)=>{const logo=c.team?.logo||c.team?.logos?.[0]?.href||"",faded=winnerId&&winnerId!==c.id?" dim":"",key=`${event.id}:${c.id}`,changed=scoreChanges.has(key);return `<div class="team ${side}${winnerId===c.id?" winner":""}${faded}">${logo?`<img class="logo" src="${esc(logo)}" alt="" referrerpolicy="no-referrer">`:`<div class="logo"></div>`}<div class="team-copy"><span class="team-name">${esc(teamName(c))}</span><span class="record">${esc(getRecord(c))}</span></div><span class="score-box"><span class="score${possession===c.id?" possession":""}${changed?" flip":""}">${esc(c.score??"0")}</span></span></div>`};
 let foot="";if(isLive){const sit=situationText(comp);foot=sit?`<strong>LIVE</strong><span class="situation">${esc(sit)}</span>`:`<strong>LIVE</strong><span class="situation">DOWN &amp; DISTANCE UPDATING</span>`}else foot=`<span class="situation">${esc(comp.venue?.fullName||event.status?.type?.detail||"")}</span>`;
 return `<article class="game${isLive?" is-live":""}${redZone?" in-red-zone":""}" style="--away:${teamColor(away.team)};--home:${teamColor(home.team,"19374f")}"><div class="game-head"><span class="status${isLive?" live":""}${info.twoMinute?" two-minute":""}">${esc(info.label)}</span><span class="badges"><span class="red-zone">RED ZONE</span></span></div>${row(away,"away")}${row(home,"home")}<div class="game-foot">${foot}</div></article>`}
function render(events){const games=[...events].sort(eventSort);hasLiveGames=games.some(e=>e.status?.type?.state==="in");fitGrid(games.length||1);if(!games.length){board.innerHTML='<div class="empty"><div><strong>NO GAMES</strong><span>Waiting for the next NFL slate.</span></div></div>';return}board.innerHTML=games.map(renderGame).join("");scoreChanges.clear()}
function inferScoreType(delta,lastPlay){const text=(lastPlay||"").toLowerCase();if(delta>=6||text.includes("touchdown"))return"TOUCHDOWN";if(delta===3||text.includes("field goal")&&(text.includes("good")||text.includes("made")))return"FIELD GOAL";if(text.includes("two-point")||text.includes("two point"))return"2-POINT TRY";if(delta===2||text.includes("safety"))return"SAFETY";if(delta===1||text.includes("extra point")||text.includes("pat is good"))return"EXTRA POINT";return"SCORE CHANGE"}
function inspectScores(events){for(const event of events){const comp=event.competitions?.[0]||{},lastPlay=comp.situation?.lastPlay?.text||"";for(const c of comp.competitors||[]){const key=`${event.id}:${c.id}`,current=num(c.score),previous=knownScores.get(key);if(initialized&&previous!==undefined&&current>previous&&event.status?.type?.state==="in"){const delta=current-previous;scoreChanges.add(key);celebrationQueue.push({team:c.team||{},delta,type:inferScoreType(delta,lastPlay)})}knownScores.set(key,previous===undefined?current:Math.max(previous,current))}}if(!celebrating)showNextCelebration();initialized=true}
function showNextCelebration(){const item=celebrationQueue.shift();if(!item){celebrating=false;return}celebrating=true;const logo=item.team.logo||item.team.logos?.[0]?.href||"";overlay.style.setProperty("--team-glow",teamColor(item.team));overlay.innerHTML=`<div class="celebration-card">${logo?`<img class="celebration-logo" src="${esc(logo)}" alt="">`:""}<div class="celebration-kicker">${esc(item.team.abbreviation||"NFL")} SCORES</div><div class="celebration-type">${esc(item.type)}</div><div class="celebration-team">${esc(item.team.displayName||item.team.name||"")}</div><div class="celebration-points">+${item.delta} POINT${item.delta===1?"":"S"}</div></div><div class="celebration-timer"></div>`;overlay.classList.remove("show");void overlay.offsetWidth;overlay.classList.add("show");overlay.setAttribute("aria-hidden","false");setTimeout(()=>{overlay.classList.remove("show");overlay.setAttribute("aria-hidden","true");setTimeout(showNextCelebration,180)},5800)}
function shortStatus(event){const t=event.status?.type||{},detail=t.shortDetail||t.detail||"";if(t.state==="post")return"FINAL";if(t.state==="in")return detail||"LIVE";const d=new Date(event.date);return Number.isNaN(d.valueOf())?"UPCOMING":new Intl.DateTimeFormat([],{hour:"numeric",minute:"2-digit"}).format(d)}
function scoreTickerItem(feed,event){const teams=event.competitions?.[0]?.competitors||[],away=teams.find(c=>c.homeAway==="away")||teams[0],home=teams.find(c=>c.homeAway==="home")||teams[1];if(!away||!home)return null;const state=event.status?.type?.state,rank=state==="in"?0:state==="post"?1:2;return{kind:"score",label:feed.label,rank,text:`${away.team?.abbreviation||teamName(away)} ${away.score??"–"}  ${home.team?.abbreviation||teamName(home)} ${home.score??"–"} · ${shortStatus(event)}`}}
function renderTicker(){if(!tickerItems.length){tickerWindow.innerHTML='<div class="ticker-empty">LIVE SCORES AND HEADLINES ARE UPDATING…</div>';return}const items=tickerItems.map(x=>`<span class="ticker-item${x.kind==="news"?" news":""}"><b>${esc(x.label)}</b><span>${esc(x.text)}</span></span>`).join(""),chars=tickerItems.reduce((n,x)=>n+x.text.length+x.label.length,0),duration=Math.max(55,Math.min(180,chars*.19));tickerWindow.innerHTML=`<div class="ticker-track" style="--ticker-duration:${duration}s"><div class="ticker-set">${items}</div><div class="ticker-set" aria-hidden="true">${items}</div></div>`}
async function getJson(url){const res=await fetch(url,{cache:"no-store"});if(!res.ok)throw new Error(`HTTP ${res.status}`);return res.json()}
async function refreshTicker(){clearTimeout(tickerTimer);const jobs=[];for(const feed of TICKER_FEEDS){jobs.push(getJson(feed.score).then(data=>({type:"score",feed,data})),getJson(feed.news).then(data=>({type:"news",feed,data})))}const settled=await Promise.allSettled(jobs),scores=[],news=[];for(const result of settled){if(result.status!=="fulfilled")continue;const {type,feed,data}=result.value;if(type==="score"){for(const event of (data.events||[]).slice(0,8)){const item=scoreTickerItem(feed,event);if(item)scores.push(item)}}else{for(const article of (data.articles||[]).slice(0,2)){const text=article.headline||article.title;if(text)news.push({kind:"news",label:`${feed.label} NEWS`,rank:3,text})}}}scores.sort((a,b)=>a.rank-b.rank);tickerItems=[...scores.slice(0,26),...news.slice(0,10)];renderTicker();tickerTimer=setTimeout(refreshTicker,120000)}
async function refresh(){clearTimeout(pollTimer);try{const data=await getJson(SCOREBOARD_URL),events=Array.isArray(data.events)?data.events:[];inspectScores(events);render(events);lastSuccess=Date.now();signal.className=`signal${hasLiveGames?" live":""}`}catch(err){console.error("Scoreboard refresh failed",err);signal.className="signal error";if(!lastSuccess)board.innerHTML='<div class="empty"><div><strong>OFFLINE</strong><span>Could not reach ESPN. Retrying automatically…</span></div></div>'}pollTimer=setTimeout(refresh,hasLiveGames?5000:30000)}
function updateSync(){if(!lastSuccess){syncText.textContent="CONNECTING";return}const age=Math.max(0,Math.floor((Date.now()-lastSuccess)/1000));syncText.textContent=signal.classList.contains("error")?`RETRYING · ${age}s`:`UPDATED ${age}s AGO`}
setInterval(updateSync,1000);document.addEventListener("visibilitychange",()=>{if(!document.hidden){refresh();refreshTicker()}});window.addEventListener("online",()=>{refresh();refreshTicker()});refresh();refreshTicker();
</script>
