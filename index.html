<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7th Annual Race Party — Driver Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --asphalt: #0b0d10;
    --surface: #15181d;
    --surface-2: #1c2027;
    --hairline: #2a2f38;
    --caution: #f5c518;
    --flag-red: #d3242c;
    --chrome: #d7dbe0;
    --chrome-dim: #8b929c;
    --chevy: #f5b400;
    --ford: #2f8fd6;
    --toyota: #e33b3b;
    --wood: #b98b4e;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:
      radial-gradient(ellipse at top, #171a1f 0%, var(--asphalt) 55%),
      repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 6px);
    color:var(--chrome);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }

  .checker{
    height:14px;
    background-image:
      linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%),
      linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%);
    background-color:#eee;
    background-size:14px 14px;
    background-position:0 0, 7px 7px;
  }

  header{
    max-width:1200px;
    margin:0 auto;
    padding:36px 24px 20px;
    text-align:center;
  }

  .eyebrow{
    font-family:'Share Tech Mono', monospace;
    letter-spacing:.35em;
    font-size:12px;
    color:var(--caution);
    text-transform:uppercase;
    margin-bottom:10px;
  }

  h1{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    text-transform:uppercase;
    font-size:clamp(28px, 5vw, 52px);
    letter-spacing:.03em;
    margin:0;
    color:#fff;
    text-shadow:0 0 24px rgba(245,197,24,0.15);
  }

  h1 span{color:var(--flag-red);}

  .subhead{
    margin-top:10px;
    color:var(--chrome-dim);
    font-size:14px;
    font-family:'Share Tech Mono', monospace;
    letter-spacing:.08em;
  }

  main{
    max-width:1200px;
    margin:0 auto;
    padding:24px;
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:16px;
  }

  @media (max-width: 1100px){ main{ grid-template-columns:repeat(2, 1fr); } }
  @media (max-width: 640px){ main{ grid-template-columns:1fr; padding:16px; } }

  .pool{
    background:var(--surface);
    border:1px solid var(--hairline);
    border-radius:6px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  .pool-head{
    background:var(--surface-2);
    border-bottom:2px solid var(--caution);
    padding:12px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }

  .pool-name{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.05em;
    font-size:17px;
    color:#fff;
  }

  .flag-badge{
    display:flex;
    align-items:center;
    gap:5px;
    font-family:'Share Tech Mono', monospace;
    font-size:12px;
    color:var(--caution);
  }

  .flag-icon{ width:16px; height:12px; display:block; }

  .drivers{
    display:flex;
    flex-direction:column;
  }

  .driver{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 14px;
    border-top:1px solid var(--hairline);
  }

  .roundel{
    flex:0 0 auto;
    width:34px;
    height:34px;
    border-radius:50%;
    background:#fff;
    border:3px solid var(--num-color, var(--chrome-dim));
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:13px;
    color:#111;
  }

  .headshot-wrap{
    flex:0 0 auto;
    width:38px;
    height:38px;
    border-radius:50%;
    overflow:hidden;
    background:var(--surface-2);
    border:1px solid var(--hairline);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Oswald', sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--chrome-dim);
  }

  .headshot-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
    transition:opacity .35s ease;
  }

  .headshot-wrap img.loaded{ opacity:1; }

  .driver-info{
    display:flex;
    flex-direction:column;
    line-height:1.25;
    min-width:0;
  }

  .driver-name{
    font-weight:600;
    font-size:14px;
    color:#fff;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .driver-team{
    font-size:11px;
    color:var(--chrome-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  footer{
    max-width:1200px;
    margin:30px auto 0;
    padding:0 24px;
    text-align:center;
    color:var(--chrome-dim);
    font-family:'Share Tech Mono', monospace;
    font-size:11px;
    letter-spacing:.05em;
  }
</style>
</head>
<body>

<div class="checker"></div>

<header>
  <div class="eyebrow">Pit Board · Driver Draft</div>
  <h1>7<span>th</span> Annual Race Party</h1>
  <div class="subhead">EACH POOL SHOWS THE DRIVERS DRAFTED · CAR NUMBER COLORED BY MANUFACTURER</div>
</header>

<main id="board"></main>

<footer>Chevrolet · Ford · Toyota &nbsp;—&nbsp; headshots loaded live from Wikipedia</footer>

<div class="checker"></div>

<script>
// ---- DATA -------------------------------------------------------
// Edit this array to update pools/drivers for next year's party.
// mfg: 'chevy' | 'ford' | 'toyota'  (controls the roundel color)
const pools = [
  { owner:"Pam", flags:4, drivers:[
    {num:23, name:"Bubba Wallace", team:"23XI Racing", mfg:"toyota"},
    {num:54, name:"Ty Gibbs", team:"Joe Gibbs Racing", mfg:"toyota"},
    {num:2,  name:"Austin Cindric", team:"Team Penske", mfg:"ford"},
  ]},
  { owner:"Ron", flags:4, drivers:[
    {num:5,  name:"Kyle Larson", team:"Hendrick Motorsports", mfg:"chevy"},
    {num:88, name:"Connor Zilisch", team:"Trackhouse Racing", mfg:"chevy"},
    {num:71, name:"Michael McDowell", team:"Spire Motorsports", mfg:"chevy"},
  ]},
  { owner:"Scott", flags:4, drivers:[
    {num:12, name:"Ryan Blaney", team:"Team Penske", mfg:"ford"},
    {num:17, name:"Chris Buescher", team:"RFK Racing", mfg:"ford"},
    {num:60, name:"Ryan Preece", team:"RFK Racing", mfg:"ford"},
  ]},
  { owner:"Nick", flags:4, drivers:[
    {num:45, name:"Tyler Reddick", team:"23XI Racing", mfg:"toyota"},
    {num:6,  name:"Brad Keselowski", team:"RFK Racing", mfg:"ford"},
    {num:4,  name:"Noah Gragson", team:"Front Row Motorsports", mfg:"ford"},
  ]},
  { owner:"Zach", flags:3, drivers:[
    {num:9,  name:"Chase Elliott", team:"Hendrick Motorsports", mfg:"chevy"},
    {num:77, name:"Carson Hocevar", team:"Spire Motorsports", mfg:"chevy"},
    {num:67, name:"Corey Heim", team:"23XI Racing", mfg:"toyota"},
  ]},
  { owner:"Ace", flags:2, drivers:[
    {num:11, name:"Denny Hamlin", team:"Joe Gibbs Racing", mfg:"toyota"},
    {num:48, name:"Alex Bowman", team:"Hendrick Motorsports", mfg:"chevy"},
    {num:43, name:"Erik Jones", team:"Legacy Motor Club", mfg:"toyota"},
  ]},
  { owner:"Nicole", flags:2, drivers:[
    {num:24, name:"William Byron", team:"Hendrick Motorsports", mfg:"chevy"},
    {num:1,  name:"Ross Chastain", team:"Trackhouse Racing", mfg:"chevy"},
    {num:7,  name:"Daniel Suárez", team:"Spire Motorsports", mfg:"chevy"},
  ]},
  { owner:"Daniel", flags:1, drivers:[
    {num:19, name:"Chase Briscoe", team:"Joe Gibbs Racing", mfg:"toyota"},
    {num:3,  name:"Austin Dillon", team:"Richard Childress Racing", mfg:"chevy"},
    {num:38, name:"Zane Smith", team:"Front Row Motorsports", mfg:"ford"},
  ]},
  { owner:"KO3", flags:1, drivers:[
    {num:22, name:"Joey Logano", team:"Team Penske", mfg:"ford"},
    {num:97, name:"Shane van Gisbergen", team:"Trackhouse Racing", mfg:"chevy"},
    {num:34, name:"Todd Gilliland", team:"Front Row Motorsports", mfg:"ford"},
  ]},
  { owner:"Brenda", flags:0, drivers:[
    {num:20, name:"Christopher Bell", team:"Joe Gibbs Racing", mfg:"toyota"},
    {num:47, name:"Ricky Stenhouse Jr.", team:"Hyak Motorsports", mfg:"chevy"},
    {num:21, name:"Josh Berry", team:"Wood Brothers Racing", mfg:"ford"},
  ]},
];

const mfgColor = { chevy:"var(--chevy)", ford:"var(--ford)", toyota:"var(--toyota)" };

function initials(name){
  return name.split(" ").filter(Boolean).map(w=>w[0]).slice(0,2).join("").toUpperCase();
}

function flagIconSVG(){
  return `<svg class="flag-icon" viewBox="0 0 16 12" xmlns="http://www.w3.org/2000/svg">
    <rect width="16" height="12" fill="#fff"/>
    <g fill="#111">
      <rect x="0" y="0" width="4" height="4"/><rect x="8" y="0" width="4" height="4"/>
      <rect x="4" y="4" width="4" height="4"/><rect x="12" y="4" width="4" height="4"/>
      <rect x="0" y="8" width="4" height="4"/><rect x="8" y="8" width="4" height="4"/>
    </g>
  </svg>`;
}

function render(){
  const board = document.getElementById("board");
  board.innerHTML = pools.map(pool => `
    <section class="pool">
      <div class="pool-head">
        <div class="pool-name">${pool.owner}</div>
        ${pool.flags > 0 ? `<div class="flag-badge">${flagIconSVG()}×${pool.flags}</div>` : ""}
      </div>
      <div class="drivers">
        ${pool.drivers.map(d => `
          <div class="driver">
            <div class="roundel" style="--num-color:${mfgColor[d.mfg]}">${d.num}</div>
            <div class="headshot-wrap" data-name="${d.name}">${initials(d.name)}</div>
            <div class="driver-info">
              <div class="driver-name">${d.name}</div>
              <div class="driver-team">${d.team}</div>
            </div>
          </div>
        `).join("")}
      </div>
    </section>
  `).join("");

  loadHeadshots();
}

// ---- LIVE HEADSHOT LOOKUP (Wikipedia REST API, no API key needed) ----
const cache = {};
async function fetchHeadshot(name){
  if (cache[name] !== undefined) return cache[name];
  try {
    const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(name)}`);
    if (!res.ok) throw new Error("not found");
    const data = await res.json();
    const url = data.thumbnail && data.thumbnail.source ? data.thumbnail.source : null;
    cache[name] = url;
    return url;
  } catch (e) {
    cache[name] = null;
    return null;
  }
}

async function loadHeadshots(){
  const wraps = document.querySelectorAll(".headshot-wrap");
  for (const wrap of wraps) {
    const name = wrap.dataset.name;
    const url = await fetchHeadshot(name);
    if (url) {
      const img = document.createElement("img");
      img.src = url;
      img.alt = name;
      img.onload = () => img.classList.add("loaded");
      wrap.textContent = "";
      wrap.appendChild(img);
    }
    // if no image found, initials placeholder stays as-is
  }
}

render();
</script>

</body>
</html>
